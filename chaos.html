<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40K Painted Army Value Scorecard — Chaos / Be'lakor Edition</title>
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="nav.css">
</head>
<body>
<div class="wrap">
  <!--nav--><nav class="sitenav" aria-label="Site"><a class="mark" href="index.html">Shadow <b>Legion</b> HQ</a><a href="quartermaster.html">Army</a><span class="sep">·</span><a href="primer.html">Primer</a><span class="sep">·</span><a href="scorecard.html">Market</a><span class="sep">·</span><a href="archive.html">Archive</a><span class="sep">·</span><a href="context.html">Context</a></nav><!--/nav-->
  <h1 id="title">40K Painted Army Value Scorecard</h1>
  <p class="sub" id="sub"></p>

  <div class="kpis" id="kpis"></div>

  <h2>Top picks — best verified value</h2>
  <div class="picks" id="picks"></div>

  <h2>All listings</h2>
  <div class="controls">
    <select id="fFaction"><option value="">All factions</option></select>
    <select id="fVerdict">
      <option value="">All verdicts</option>
      <option value="BUY">BUY only</option>
      <option value="scored">Scored only</option>
      <option value="ready-to-ship">Ready-to-ship only</option>
      <option value="verified">Verified live only</option>
    </select>
    <select id="sort">
      <option value="ratio">Sort: value ratio ↓</option>
      <option value="priceAsc">Sort: price ↑</option>
      <option value="priceDesc">Sort: price ↓</option>
      <option value="points">Sort: points ↓</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="scroll"><table>
    <thead><tr>
      <th data-s="name">Listing</th><th data-s="priceAsc" class="num">Price</th>
      <th data-s="points" class="num">Points</th><th class="num">Landed</th>
      <th class="num">Kit MSRP</th><th>Paint</th><th data-s="ratio" class="num">Value · tick=1.0×</th>
      <th>Verdict</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>

  <footer id="foot"></footer>
</div>

<script src="chaos.js"></script>
<script src="viewer.js"></script>
</body>
</html>
